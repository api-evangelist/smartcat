aid: smartcat
name: Smartcat
description: >-
  Smartcat is an AI-powered translation and localization platform that lets teams translate
  content instantly and at scale across 280+ languages, combining machine translation, AI
  agents, human linguist workflows, translation memories, and glossaries. Its integration API
  (/api/integration/v1) provides programmatic access to projects, documents, translation
  memories, glossaries, quotes, invoices, vendors, teams, and status callbacks, and is designed
  as a full-fledged equivalent and extension of the Smartcat web UI. The API spans 176
  operations across 27 resource groups, uses HTTP Basic authentication (Account ID + API key),
  is rate limited to four requests per second, and is served from regional hosts for Europe
  (smartcat.com), the Americas (us.smartcat.com) and Asia (ea.smartcat.com). The company was
  surfaced as a portfolio company of Matrix Partners and has been enriched from its public
  developer surface.
