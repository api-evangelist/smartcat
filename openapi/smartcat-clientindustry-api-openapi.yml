openapi: 3.2.0
info:
  title: Smartcat Client Industry API
  version: v1
servers:
- url: /
tags:
- name: ClientIndustry
paths:
  /api/integration/v1/clientIndustry/{id}:
    get:
      tags:
      - ClientIndustry
      summary: Fetch a directory entry by ID
      parameters:
      - name: id
        in: path
        description: Directory entry ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ClientIndustryModel'
            application/json:
              schema:
                $ref: '#/components/schemas/ClientIndustryModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ClientIndustryModel'
      operationId: getApiIntegrationV1ClientIndustryById
      x-operation-id-source: derived
    put:
      tags:
      - ClientIndustry
      summary: Update the name of an entry by ID
      parameters:
      - name: id
        in: path
        description: Entry ID
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: New entry name
        schema:
          type: string
      responses:
        '204':
          description: No Content
      operationId: putApiIntegrationV1ClientIndustryById
      x-operation-id-source: derived
    delete:
      tags:
      - ClientIndustry
      summary: Delete a list entry
      parameters:
      - name: id
        in: path
        description: Entry ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      operationId: deleteApiIntegrationV1ClientIndustryById
      x-operation-id-source: derived
  /api/integration/v1/clientIndustry:
    get:
      tags:
      - ClientIndustry
      summary: Fetch all the available directory values
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientIndustryModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientIndustryModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientIndustryModel'
      operationId: getApiIntegrationV1ClientIndustry
      x-operation-id-source: derived
  /api/integration/v1/clientIndustry/{name}:
    post:
      tags:
      - ClientIndustry
      summary: Add a directory entry
      parameters:
      - name: name
        in: path
        description: Entry name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
      operationId: postApiIntegrationV1ClientIndustryByName
      x-operation-id-source: derived
components:
  schemas:
    ClientIndustryModel:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Directory entry ID
        name:
          type:
          - string
          - 'null'
          description: List entry value
      additionalProperties: false
      description: Model of an entry in a client's specializations list
