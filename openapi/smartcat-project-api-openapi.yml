components:
  schemas:
    SubtitleSegmentationMode:
      enum:
      - by-cue
      - by-sentence
      type: string
      description: Subtitle auto-segmentation mode for project creation.
      format: int32
    CreateProjectNumberModel:
      type: object
      properties:
        useTemplate:
          type: boolean
          description: Use a number generation template
        number:
          type: string
          description: Project number (the value is ignored if a template generated number is applied)
          nullable: true
      additionalProperties: false
      description: Data class for project number creation
    TranslationMemoriesForLanguageModel:
      type: object
      properties:
        language:
          type: string
          description: Language associated with TM list
          nullable: true
        translationMemories:
          type: array
          items:
            $ref: '#/components/schemas/TranslationMemoryForProjectModel'
          description: TM list
          nullable: true
        onlyExactSourceLanguageMatch:
          type: boolean
          description: Specifies whether exact match with the source language is required
          nullable: true
        onlyExactTargetLanguageMatch:
          type: boolean
          description: Specifies whether exact match with the target language is required
          nullable: true
      additionalProperties: false
      description: Project language TMs model
    DocumentPackageModel:
      type: object
      properties:
        isRoot:
          type: boolean
          description: Indicates whether the document is the root of the package
        packageId:
          type: string
          description: Identifier of the package the document belongs to
          format: uuid
        parentPackageId:
          type: string
          description: Identifier of the parent package in the hierarchy, if any
          format: uuid
          nullable: true
      additionalProperties: false
      description: Package information for a document that belongs to a file package
    ProjectWorkflowStageModel:
      type: object
      properties:
        id:
          type: string
          description: ID
          format: uuid
        progress:
          type: number
          description: Completion percentage
          format: double
        stageType:
          $ref: '#/components/schemas/StageType'
      additionalProperties: false
      description: Project workflow stage model
    BilingualFileImportSetingsModel:
      type: object
      properties:
        targetSubstitutionMode:
          $ref: '#/components/schemas/TargetSubstitutionMode'
        targetLanguageUsageMode:
          $ref: '#/components/schemas/TargetLanguageUsageMode'
        lockMode:
          $ref: '#/components/schemas/LockMode'
        confirmMode:
          $ref: '#/components/schemas/ConfirmMode'
        saveType:
          $ref: '#/components/schemas/SaveType'
      additionalProperties: false
      description: Bilingual document upload settings model
    ConfirmMode:
      enum:
      - none
      - byStates
      - atFirstStage
      - atLastStage
      type: string
      description: Mode of segment confirmation at file upload
      format: int32
    PretranslateRuleModel:
      required:
      - order
      - ruleType
      type: object
      properties:
        ruleType:
          $ref: '#/components/schemas/PretranslateRuleType'
        order:
          type: integer
          description: Ordering number of the rule (starting with 1)
          format: int32
        confirmAtWorkflowStep:
          type: string
          description: "Specify at which workflow stage pretranslation segments must be confirmed\r\n(null if confirmation is not required)"
          format: uuid
          nullable: true
        translationMemoryId:
          type: string
          description: Translation memory (TM) ID, if the rule involves the use of TM matches
          format: uuid
          nullable: true
        minThreshold:
          type: integer
          description: Minimum match threshold, if the rule involves the use of TM matches
          format: int32
          nullable: true
        minTQSQualityThreshold:
          type: integer
          description: Minimum threshold score for TQS
          format: int32
          nullable: true
        minSegmentWordsCount:
          type: integer
          description: Minimum segment length, if the rule involves the use of TM matches
          format: int32
          nullable: true
        minAssuranceLevel:
          $ref: '#/components/schemas/TMTranslationAssuranceLevel'
        lqaProfileId:
          type: string
          description: LQA profile which is used by the LQA automation rule
          nullable: true
        blockingSeverityIds:
          type: array
          items:
            type: string
          description: LQA severity ids whose presence on a segment prevents auto-confirmation by the LQA automation rule
          nullable: true
