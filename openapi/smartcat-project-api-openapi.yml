  /api/integration/v2/project/{projectId}/export:
    post:
      tags:
      - Project
      summary: Run export from Software Localization Project
      description: "Examples and detailed explanation can be found in this article:\r\nhttps://developers.smartcat.com/#extended-import-export-functionality"
      parameters:
      - name: projectId
        in: path
        description: Project ID
        required: true
        schema:
          type: string
          format: uuid
      - name: collections
        in: query
        description: Comma-separated collections list to export (optional, "main" as default)
        schema:
          type: string
      - name: languages
        in: query
        description: Comma-separated list of languages to export (optional, all target languages by default)
        schema:
          type: string
      - name: format
        in: query
        description: Export format (optional, JSON by default)
        schema:
          $ref: '#/components/schemas/SoftwareLocalizationDocumentFormat'
      - name: path-separator
        in: query
        description: "Path separator string (optional)\r\nWhen exporting \"structured-json\" and \"structured-yaml\" file formats,\r\nthis separator string will be used to split the key into multiple parts and construct the tree structure."
        schema:
          type: string
      - name: completion-state
        in: query
        description: "Minimal key completion state (optional)\r\nSpecifies the state in which any key (segment) must be in order to be exported.\r\ndraft — download any translations, even unconfirmed ones (default)\r\nintermediate — download segments at the last confirmed stage\r\nfinal — download segments that passed through all translation stages"
        schema:
          $ref: '#/components/schemas/SegmentCompletionState'
      - name: fallback-to-default-language
        in: query
        description: Return default language values instead of incomplete translations (default)
        schema:
          type: boolean
      - name: export-incomplete-as-blank
        in: query
        description: Export blank values when no translation is ready
        schema:
          type: boolean
      - name: skip-incomplete-keys
        in: query
        description: Do not export keys that have no translations (will be used as a default for the "android-xml" export file type)
        schema:
          type: boolean
      - name: output-file-path-template
        in: query
        description: "Output file path template (Optional)\r\nSpecifies how the output files should be named and located.\r\nYou can use the {LANGUAGE} and {LABEL:PREFIX} placeholders to customize the output.\r\nThe {LOCALE:IOS} and {LOCALE:ANDROID} placeholders are also available for platform specific exports.\r\nThe ability to specify {LABEL:PREFIX} placeholder allows you to export keys that have the PREFIX value\r\nof label prefix and use the label suffix to determine the file name.\r\nSee examples [here](http://developers.sc.local/software-localization/#file-path-template)"
        schema:
          type: string
      - name: include-default-language
        in: query
        description: Specify if the default language should be included in the export
        schema:
          type: boolean
      - name: zip
        in: query
        description: Force export to a ZIP archive, even for a single file
        schema:
          type: boolean
      - name: modified-since
        in: query
        description: Export keys that were changed after the datetime
        schema:
          type: string
          format: date-time
      - name: labels
        in: query
        description: Comma-separated list of labels to export keys that are marked with labels
        schema:
          type: string
      - name: indent
        in: query
        description: Indent for formatting the exporting file (optional, 2 spaces by default)
        schema:
          type: string
      requestBody:
        description: Export keys model
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ExportKeysFromSoftwareLocalizationProjectModel'
          application/json:
            schema:
              $ref: '#/components/schemas/ExportKeysFromSoftwareLocalizationProjectModel'
          text/json:
            schema:
              $ref: '#/components/schemas/ExportKeysFromSoftwareLocalizationProjectModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ExportKeysFromSoftwareLocalizationProjectModel'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                format: uuid
            application/json:
              schema:
                type: string
                format: uuid
            text/json:
              schema:
                type: string
                format: uuid
        '400':
          description: The provided model is invalid
        '403':
          description: The project is not associated with the account
        '404':
          description: The provided IDs do not match any project
