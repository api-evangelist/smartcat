          readOnly: true
        keysCreated:
          type: integer
          format: int32
          readOnly: true
        keysUpdated:
          type: integer
          format: int32
          readOnly: true
        keysDeleted:
          type: integer
          format: int32
          readOnly: true
        keyValuesNotChanged:
          type: integer
          format: int32
          readOnly: true
        keysWithoutSource:
          type: integer
          format: int32
          readOnly: true
        conflictingKeyValues:
