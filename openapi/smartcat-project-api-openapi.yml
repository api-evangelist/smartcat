  /api/integration/v1/project/create:
    post:
      tags:
      - Project
      summary: Create the project
      description: "This method uses special structure for multipart/form-data content\r\nPlease read this article in order to create a proper request\r\nhttps://developers.smartcat.com/api-guides/#multipart-requests\r\nIf you need more comprehensive overview of the project creation process\r\nyou can find this series of articles with detailed explanations and examples\r\nhttps://developers.smartcat.com/api-guides/#creating-a-project"
      requestBody:
        description: Project with files creation model
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                value:
                  $ref: '#/components/schemas/CreateProjectModel'
                files:
                  type: array
                  items:
                    type: string
                    format: binary
        required: true
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProjectModel'
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ProjectModel'
        '400':
          description: "Returns if:\n\r\n- The project model is empty\r\n- The project description length exceeds the allowed maximum\r\n- The user ID was not found in the specified account\r\n- The domain ID is incorrect\r\n- The client ID is incorrect\r\n- The vendor ID is incorrect\r\n- The account does not support the test project creation"
        '403':
          description: The specified account is personal
        '404':
          description: Account not found
        '409':
          description: Several documents with identical names are being added to the project
  /api/integration/v2/project/{projectId}/import:
    post:
      tags:
      - Project
      summary: Import keys and values from files into the Software Localization Project
      parameters:
      - name: projectId
        in: path
        description: Project identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: collection
        in: query
        description: Target collection (optional, "main" as default)
        schema:
          type: string
      - name: language
        in: query
        description: Language of the imported files
        schema:
          type: string
      - name: target-languages
        in: query
        description: "Comma separated list of target languages\r\n(optional, all target languages of the project by default, can only be specified when importing the source).\r\n- Empty list of languages produces a 400 bad request error with an appropriate reason text\r\n- An incorrect language code produces a 400 bad request error with an appropriate reason text\r\n- If any language didn't exist in the project, it will be created (but not added as a target to any existing collections)\r\n- If any language didn't exist in the collection (the target collection existed before), it will be added as a target to the collection"
        schema:
          type: string
      - name: format
        in: query
        description: "Specifies the file format used to import the file (optional).\r\nSmartcat will try to identify the file format from its extension."
        schema:
          $ref: '#/components/schemas/SoftwareLocalizationDocumentFormat'
      - name: completion-state
        in: query
        description: "Imported translation confirmation mode\r\ndraft — translation must be imported but not confirmed on any stage (default)\r\nintermediate — the translation must be imported and automatically confirmed at the first project stage\r\nfinal — the translation must be imported and confirmed on all project stages"
        schema:
          $ref: '#/components/schemas/SegmentCompletionState'
      - name: labels
        in: query
        description: Comma-separated labels that will be attached to the created/updated segments (even if the text is not changed)
        schema:
          type: string
      - name: path-separator
        in: query
        description: Path separator string (optional)
        schema:
          type: string
      - name: skip-conflicting-values
        in: query
        description: "Specifies how to deal with situations when the same key has a different\r\nvalue in the imported file and in Smartcat - keeps the value in Smartcat by default"
        schema:
          type: boolean
      - name: overwrite-conflicting-values
        in: query
        description: When the same key has a different value in the imported file and in Smartcat - use the value from the file
        schema:
          type: boolean
      - name: auto-file-labels
        in: query
        description: Should Smartcat automatically create labels after file names?
        schema:
          type: boolean
      - name: delete-missing-keys
        in: query
        description: Delete keys that are not present in the imported files
        schema:
          type: boolean
      requestBody:
        description: Files for import
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                format: uuid
            application/json:
              schema:
                type: string
                format: uuid
            text/json:
              schema:
                type: string
                format: uuid
  /api/integration/v1/project/document:
    post:
      tags:
      - Project
      summary: Add a document to the project
      description: "This method uses special structure for multipart/form-data content\r\nPlease read this article in order to create a proper request\r\nhttps://developers.smartcat.com/api-guides/#multipart-requests"
      parameters:
      - name: projectId
        in: query
        description: Project ID
        required: true
        schema:
          type: string
          format: uuid
      - name: disassembleAlgorithmName
        in: query
        description: Optional algorithm of file disassembly
        schema:
          type: string
      - name: externalId
        in: query
        description: External identifier assigned by the client upon the document creation
        schema:
          type: string
      - name: metaInfo
        in: query
        description: Additional user information about the document
        schema:
          type: string
      - name: targetLanguages
        in: query
        description: Comma-separated target languages of all documents. Optional parameter. Can be modified per document in the request body. By default, lists the project target languages.
        schema:
          type: string
      - name: presetDisassembleAlgorithm
        in: query
        description: Optional preset for the file disassembly algorithm
        schema:
          type: string
