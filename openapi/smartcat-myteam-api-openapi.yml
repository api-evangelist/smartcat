openapi: 3.2.0
info:
  title: Smartcat My Team API
  version: v1
servers:
- url: /
tags:
- name: MyTeam
paths:
  /api/integration/v1/account/myTeam/{userId}:
    get:
      tags:
      - MyTeam
      summary: Fetch a MyTeam member model by ID
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MyTeamMemberModel'
            application/json:
              schema:
                $ref: '#/components/schemas/MyTeamMemberModel'
            text/json:
              schema:
                $ref: '#/components/schemas/MyTeamMemberModel'
        '404':
          description: User not found
      operationId: getApiIntegrationV1AccountMyTeamByUserId
      x-operation-id-source: derived
    delete:
      tags:
      - MyTeam
      summary: Delete the user from MyTeam
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Request has been successfully completed
      operationId: deleteApiIntegrationV1AccountMyTeamByUserId
      x-operation-id-source: derived
  /api/integration/v1/account/myTeam:
    get:
      tags:
      - MyTeam
      summary: Fetch a MyTeam member model by external ID
      parameters:
      - name: externalId
        in: query
        description: User external ID
        schema:
          type: string
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MyTeamMemberModel'
            application/json:
              schema:
                $ref: '#/components/schemas/MyTeamMemberModel'
            text/json:
              schema:
                $ref: '#/components/schemas/MyTeamMemberModel'
        '404':
          description: User not found
      operationId: getApiIntegrationV1AccountMyTeam
      x-operation-id-source: derived
    post:
      tags:
      - MyTeam
      summary: Add an in-house translator to MyTeam as a linguist
      requestBody:
        description: Model of adding an in-house translator as a linguist
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/InhouseTranslatorCreationModel'
          application/json:
            schema:
              $ref: '#/components/schemas/InhouseTranslatorCreationModel'
          text/json:
            schema:
              $ref: '#/components/schemas/InhouseTranslatorCreationModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/InhouseTranslatorCreationModel'
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MyTeamMemberModel'
            application/json:
              schema:
                $ref: '#/components/schemas/MyTeamMemberModel'
            text/json:
              schema:
                $ref: '#/components/schemas/MyTeamMemberModel'
        '400':
          description: Provided information is incorrect
        '404':
          description: Unable to find an account connected to the integration API
        '409':
          description: A linguist with the provided email or external ID is already added to the team
      operationId: postApiIntegrationV1AccountMyTeam
      x-operation-id-source: derived
  /api/integration/v1/account/searchMyTeam:
    post:
      tags:
      - MyTeam
      summary: Search for linguists in MyTeam
      requestBody:
        description: Linguist search model
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/MyTeamSearchRequestModel'
          application/json:
            schema:
              $ref: '#/components/schemas/MyTeamSearchRequestModel'
          text/json:
            schema:
              $ref: '#/components/schemas/MyTeamSearchRequestModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/MyTeamSearchRequestModel'
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyTeamMemberModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyTeamMemberModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyTeamMemberModel'
        '400':
          description: 'Returns if:


            - Maximum required number of results is greater than 500

            - Specified language is unknown

            - Specified service type is unknown

            - Specified subject expertise (specialization) is unknown

            - Specified currency is unknown

            - Specified level of subject expertise (specialization) is unknown'
        '404':
          description: Unable to find an account connected to the integration API
      operationId: postApiIntegrationV1AccountSearchMyTeam
      x-operation-id-source: derived
  /api/integration/v1/account/myTeam/{userId}/services/replace:
    post:
      tags:
      - MyTeam
      summary: Replace all services in a MyTeam profile
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
      requestBody:
        description: All service replacement model
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ReplaceServicesModel'
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceServicesModel'
          text/json:
            schema:
              $ref: '#/components/schemas/ReplaceServicesModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ReplaceServicesModel'
      responses:
        '204':
          description: Request has been successfully completed
        '400':
          description: Provided information is incorrect
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: User not found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: postApiIntegrationV1AccountMyTeamByUserIdServicesReplace
      x-operation-id-source: derived
  /api/integration/v1/account/myTeam/{userId}/phone:
    put:
      tags:
      - MyTeam
      summary: Add a MyTeam member's phone number
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
      requestBody:
        description: Phone number
        content:
          application/json-patch+json:
            schema:
              type: string
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
          application/*+json:
            schema:
              type: string
      responses:
        '204':
          description: Request has been successfully completed
        '404':
          description: User not found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: putApiIntegrationV1AccountMyTeamByUserIdPhone
      x-operation-id-source: derived
  /api/integration/v1/account/myTeam/{userId}/comment:
    put:
      tags:
      - MyTeam
      summary: Add a comment to a MyTeam member profile
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
      requestBody:
        description: Commentary
        content:
          application/json-patch+json:
            schema:
              type: string
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
          application/*+json:
            schema:
              type: string
      responses:
        '204':
          description: Request has been successfully completed
        '400':
          description: Comment length exceeds 500 characters
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: User not found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: putApiIntegrationV1AccountMyTeamByUserIdComment
      x-operation-id-source: derived
components:
  schemas:
    ReplaceServicesModel:
      type: object
      properties:
        services:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceModel'
          description: Services
      additionalProperties: false
      description: MyTeam member services replacement model
    SpecializationKnowledgeLevel:
      enum:
      - tested
      - certified
      - coursePassed
      type: string
      description: Level of specialization expertise
      format: int32
    ServiceModel:
      type: object
      properties:
        serviceType:
          $ref: '#/components/schemas/FreelancerServiceType'
        sourceLanguage:
          type:
          - string
          - 'null'
          description: Source language
        targetLanguage:
          type:
          - string
          - 'null'
          description: Target language
        pricePerUnit:
          type:
          - number
          - 'null'
          description: Price per unit
          format: double
        performancePerDay:
          type:
          - number
          - 'null'
          description: User's daily performance per service
          format: double
        currency:
          type:
          - string
          - 'null'
          description: Currency
        specializations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Specialization'
          description: Specializations for a written service
      additionalProperties: false
      description: Service model
    Specialization:
      enum:
      - education
      - productsAndCatalogs
      - documentsAndCertificates
      - marketing
      - correspondence
      - software
      - fiction
      - scienceAndPatents
      - contractsAndReports
      - gaming
      - manuals
      - website
      - annualReport
      - corporateAndSocialResponsibility
      - technicalAndEngineering
      - cryptocurrencies
      - biochemistry
      - computingScience
      - electronics
      - metallurgy
      - nuclear
      - optics
      - printing
      - telecommunication
      - textile
      - patent
      - military
      - ecologyAndEnvironment
      - agriculture
      - artsAndCulture
      - aviationAndSpace
      - biology
      - cartography
      - chemistry
      - cosmetics
      - construction
      - architecture
      - economics
      - accounting
      - bankingAndInvestment
      - insurance
      - energy
      - thermalPowerEngineering
      - mechanicalEngineering
      - finance
      - general
      - geography
      - geology
      - mining
      - history
      - linguistics
      - philosophy
      - psychology
      - sociology
      - industry
      - industrialAutomation
      - electricalEngineering
      - iT
      - eRP
      - law
      - hR
      - mathematics
      - medicine
      - medicalEquipment
      - pharmaceutics
      - veterinaryMedicine
      - oilAndGas
      - physics
      - politicsAndSociety
      - realEstate
      - recreation
      - fashion
      - luxuryItems
      - tourismAndTravel
      - religion
      - socialScience
      - sport
      - transport
      - automotiveBusiness
      - foodAndDrinks
      - biotechnology
      - business
      - lifeSciences
      type: string
      description: Text specialization
      format: int32
    MyTeamSearchRequestModel:
      type: object
      properties:
        skip:
          type:
          - integer
          - 'null'
          description: Number of search request results to be skipped (mandatory parameter)
          format: int32
        limit:
          type:
          - integer
          - 'null'
          description: Maximum number of search request results (mandatory parameter, cannot exceed 500)
          format: int32
        serviceType:
          $ref: '#/components/schemas/FreelancerServiceType'
        sourceLanguage:
          type:
          - string
          - 'null'
          description: Source language
        targetLanguage:
          type:
          - string
          - 'null'
          description: Target language
        onlyNativeSpeakers:
          type: boolean
          description: Linguist's native language
        allDialects:
          type: boolean
          description: Search linguists in all dialects for the language pair
        minRate:
          type:
          - number
          - 'null'
          description: Minimum translation unit rate
          format: double
        maxRate:
          type:
          - number
          - 'null'
          description: Maximum translation unit rate
          format: double
        rateRangeCurrency:
          type:
          - string
          - 'null'
          description: Rate range currency
        specializations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Specialization'
          description: Specializations
        specializationKnowledgeLevel:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SpecializationKnowledgeLevel'
          description: Required level of expertise in the specified (or any other if undefined) specialization
        searchString:
          type:
          - string
          - 'null'
          description: Full-text search string
        daytime:
          type: boolean
          description: It is daytime now in the linguist's time zone
      additionalProperties: false
      description: MyTeam member search request
    MyTeamMemberModel:
      type: object
      properties:
        id:
          type: string
          description: ID
          format: uuid
        email:
          type:
          - string
          - 'null'
          description: Email
        firstName:
          type:
          - string
          - 'null'
          description: Name
        lastName:
          type:
          - string
          - 'null'
          description: Last name
        externalId:
          type:
          - string
          - 'null'
          description: MyTeam member ID in an external system
        services:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceModel'
          description: MyTeam member services
        clientIds:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: Client IDs associated with the user
        customFields:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
          description: Custom fields
      additionalProperties: false
      description: MyTeam member model
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    InhouseTranslatorCreationModel:
      type: object
      properties:
        email:
          type:
          - string
          - 'null'
          description: In-house translator email
        firstName:
          type:
          - string
          - 'null'
          description: In-house translator first name
        lastName:
          type:
          - string
          - 'null'
          description: In-house translator last name
        externalId:
          type:
          - string
          - 'null'
          description: In-house translator ID in an external system
        services:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ServiceModel'
          description: Services
        clientIds:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: Client IDs associated with the user
      additionalProperties: false
      description: In-house translator creation model
    FreelancerServiceType:
      enum:
      - translation
      - editing
      - proofreading
      - postediting
      - pageProof
      - glossaryCreation
      - simultaneousTranslation
      - consecutiveTranslation
      - mediaTranslation
      - expertReview
      - projectManagement
      - translationMemoryCreation
      - copywriting
      - training
      - transcription
      - notarization
      - certifiedTranslation
      - transcreation
      - legalization
      - lQAReview
      type: string
      description: Freelancer service type
      format: int32
