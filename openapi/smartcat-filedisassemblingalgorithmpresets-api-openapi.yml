openapi: 3.2.0
info:
  title: Smartcat File Disassembling Algorithm Presets API
  version: v1
servers:
- url: /
tags:
- name: FileDisassemblingAlgorithmPresets
paths:
  /api/integration/v1/fileDisassemblingAlgorithmPresets/{id}:
    get:
      tags:
      - FileDisassemblingAlgorithmPresets
      summary: Fetch a disassembly algorithm preset
      parameters:
      - name: id
        in: path
        description: Preset ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetViewModel'
        '400':
          description: The provided ID format is incorrect
        '404':
          description: The provided preset ID does not exist
      operationId: getApiIntegrationV1FileDisassemblingAlgorithmPresetsById
      x-operation-id-source: derived
    put:
      tags:
      - FileDisassemblingAlgorithmPresets
      summary: Update a disassembly algorithm preset
      parameters:
      - name: id
        in: path
        description: ID of the preset to be updated
        required: true
        schema:
          type: string
      requestBody:
        description: Update preset model
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetEditModel'
          application/json:
            schema:
              $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetEditModel'
          text/json:
            schema:
              $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetEditModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetEditModel'
        required: true
      responses:
        '204':
          description: Request has been successfully completed
        '400':
          description: Incorrect parameter format
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: putApiIntegrationV1FileDisassemblingAlgorithmPresetsById
      x-operation-id-source: derived
    delete:
      tags:
      - FileDisassemblingAlgorithmPresets
      summary: Delete a preset
      parameters:
      - name: id
        in: path
        description: ID of the preset to be deleted
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Request has been successfully completed
      operationId: deleteApiIntegrationV1FileDisassemblingAlgorithmPresetsById
      x-operation-id-source: derived
  /api/integration/v1/fileDisassemblingAlgorithmPresets:
    get:
      tags:
      - FileDisassemblingAlgorithmPresets
      summary: Fetch all presets for the account
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetViewModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetViewModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetViewModel'
      operationId: getApiIntegrationV1FileDisassemblingAlgorithmPresets
      x-operation-id-source: derived
    post:
      tags:
      - FileDisassemblingAlgorithmPresets
      summary: Create a disassembly algorithm preset
      requestBody:
        description: Creation preset model
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetEditModel'
          application/json:
            schema:
              $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetEditModel'
          text/json:
            schema:
              $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetEditModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetEditModel'
        required: true
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetCreatedModel'
            application/json:
              schema:
                $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetCreatedModel'
            text/json:
              schema:
                $ref: '#/components/schemas/FileDisassemblingAlgorithmPresetCreatedModel'
        '400':
          description: Incorrect parameter format
      operationId: postApiIntegrationV1FileDisassemblingAlgorithmPresets
      x-operation-id-source: derived
components:
  schemas:
    FileDisassemblingAlgorithmPresetCreatedModel:
      type: object
      properties:
        presetId:
          type: string
          description: Preset ID
          format: uuid
      additionalProperties: false
      description: Created preset details
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    FileDisassemblingAlgorithmPresetViewModel:
      type: object
      properties:
        id:
          type: string
          description: ID
          format: uuid
        name:
          type:
          - string
          - 'null'
          description: Name
        algorithmName:
          type:
          - string
          - 'null'
          description: Algorithm
        settings:
          description: Settings
      additionalProperties: false
      description: Preset view model
    FileDisassemblingAlgorithmPresetEditModel:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Preset name
        algorithmName:
          type:
          - string
          - 'null'
          description: Preset algorithm
        settings:
          description: Settings
      additionalProperties: false
      description: Preset edit model
