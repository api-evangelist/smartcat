openapi: 3.2.0
info:
  title: Smartcat Smart Translation API
  version: v1
servers:
- url: /
tags:
- name: SmartTranslation
paths:
  /api/integration/v1/smartTranslation/translate:
    post:
      tags:
      - SmartTranslation
      summary: Fetch translation See the Smart Translation API guide here
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SmartTranslationRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/SmartTranslationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SmartTranslationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SmartTranslationRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SmartTranslationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/SmartTranslationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/SmartTranslationResponse'
      operationId: postApiIntegrationV1SmartTranslationTranslate
      x-operation-id-source: derived
components:
  schemas:
    SmartTranslationRequest:
      required:
      - sourceLanguage
      - targetLanguages
      - texts
      type: object
      properties:
        sourceLanguage:
          minLength: 1
          type: string
          description: Source language
        targetLanguages:
          maxItems: 2147483647
          minItems: 1
          type: array
          items:
            type: string
          description: Target languages
        profile:
          type:
          - string
          - 'null'
          description: Translation profile ID
        isHtml:
          type: boolean
          description: Indicates whether the source text is in HTML format
        texts:
          maxItems: 2147483647
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/SmartTranslationText'
          description: Translation text entry
        externalTag:
          type:
          - string
          - 'null'
          description: External system tag
      additionalProperties: false
      description: Translation request
    SmartTranslationResponse:
      type: object
      properties:
        translations:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/SmartTranslationResult'
          description: Translation results grouped by the target language
      additionalProperties: false
      description: Successful response to a translation request
    SmartTranslationResult:
      type: object
      properties:
        translation:
          type:
          - string
          - 'null'
          description: Translation.
        error:
          type: boolean
          description: Error flag.
        segmentMetadata:
          type:
          - string
          - 'null'
          description: Optional opaque per-segment metadata associated with the translated text. Null when absent.
      additionalProperties: false
      description: Translation result.
    SmartTranslationText:
      required:
      - text
      type: object
      properties:
        text:
          minLength: 1
          type: string
          description: Text
        context:
          type:
          - string
          - 'null'
          description: Translation context
      additionalProperties: false
      description: Translation text
