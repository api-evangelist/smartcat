openapi: 3.2.0
info:
  title: Smartcat Translation Memories API
  version: v1
servers:
- url: /
tags:
- name: TranslationMemories
paths:
  /api/integration/v1/translationmemory/{tmId}:
    get:
      tags:
      - TranslationMemories
      summary: Fetch information about the TM
      parameters:
      - name: tmId
        in: path
        description: TM ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TranslationMemoryModel'
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationMemoryModel'
            text/json:
              schema:
                $ref: '#/components/schemas/TranslationMemoryModel'
        '403':
          description: The account cannot access the TM with the specified ID
        '404':
          description: TM with the specified was not found
      operationId: getApiIntegrationV1TranslationmemoryByTmId
      x-operation-id-source: derived
    post:
      tags:
      - TranslationMemories
      summary: Import TMX files to a TM
      parameters:
      - name: tmId
        in: path
        description: TM ID
        required: true
        schema:
          type: string
          format: uuid
      - name: replaceAllContent
        in: query
        description: Complete replacement of the TM contents is required
        required: true
        schema:
          type: boolean
      - name: assuranceLevel
        in: query
        description: Translation assurance level. Calculated based on the document editing stage at which the TM unit was saved.
        schema:
          $ref: '#/components/schemas/IntegrationApiTMTranslationAssuranceLevel'
      requestBody:
        description: TMX file to be uploaded
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                tmxFile:
                  type: string
                  format: binary
        required: true
      responses:
        '204':
          description: TMX file has been successfully imported
        '400':
          description: Imported file is not a TMX file
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The account cannot access the TM with the specified ID
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: TM with the specified ID was not found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: postApiIntegrationV1TranslationmemoryByTmId
      x-operation-id-source: derived
    delete:
      tags:
      - TranslationMemories
      summary: Delete a TM
      parameters:
      - name: tmId
        in: path
        description: TM ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: TM has been successfully deleted
        '400':
          description: The TM has Write permissions in the account
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: TM with the specified ID was not found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: deleteApiIntegrationV1TranslationmemoryByTmId
      x-operation-id-source: derived
  /api/integration/v1/translationmemory:
    get:
      tags:
      - TranslationMemories
      summary: Fetch the available TMs filtered per account
      parameters:
      - name: lastProcessedId
        in: query
        description: The latest ID fetched by the previous query
        schema:
          type: string
          format: uuid
      - name: batchSize
        in: query
        description: Required size of the returned batch
        required: true
        schema:
          type: integer
          format: int32
      - name: sourceLanguage
        in: query
        description: Source language (optional)
        schema:
          type: string
      - name: targetLanguage
        in: query
        description: Target language (optional)
        schema:
          type: string
      - name: clientId
        in: query
        description: Client ID (optional)
        schema:
          type: string
          format: uuid
      - name: searchName
        in: query
        description: TM partial name (optional)
        schema:
          type: string
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TranslationMemoryModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TranslationMemoryModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TranslationMemoryModel'
        '204':
          description: TM collection is empty
        '400':
          description: The required TM collection size is larger than 100
      operationId: getApiIntegrationV1Translationmemory
      x-operation-id-source: derived
    post:
      tags:
      - TranslationMemories
      summary: Create an empty TM
      requestBody:
        description: TM creation model
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreateTranslationMemoryModel'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTranslationMemoryModel'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateTranslationMemoryModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateTranslationMemoryModel'
        required: true
      responses:
        '201':
          description: TM has been successfully created
        '400':
          description: 'Returns if:


            - TM creation model is empty

            - TM with this name already exists in the account

            - TM name is not specified

            - TM source language is defined as a translation target language

            - An error occurred when creating the TM'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: postApiIntegrationV1Translationmemory
      x-operation-id-source: derived
  /api/integration/v1/translationmemory/task:
    get:
      tags:
      - TranslationMemories
      summary: Fetch a collection of TMX file import tasks
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TMImportTaskModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TMImportTaskModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TMImportTaskModel'
        '404':
          description: There are no unprocessed import tasks in the account
      operationId: getApiIntegrationV1TranslationmemoryTask
      x-operation-id-source: derived
  /api/integration/v1/translationmemory/{tmId}/file:
    get:
      tags:
      - TranslationMemories
      summary: Export TMX files from the TM database
      parameters:
      - name: tmId
        in: path
        description: TM ID
        required: true
        schema:
          type: string
          format: uuid
      - name: exportMode
        in: query
        description: Export mode
        required: true
        schema:
          $ref: '#/components/schemas/TMExportMode'
      - name: withTags
        in: query
        description: Specifies whether to include tags into export results
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: Request has been successfully completed
        '403':
          description: The account cannot access the TM with the specified ID
        '404':
          description: TM with the specified was not found
      operationId: getApiIntegrationV1TranslationmemoryByTmIdFile
      x-operation-id-source: derived
  /api/integration/v1/translationmemory/matches:
    post:
      tags:
      - TranslationMemories
      summary: Fetch matches from the specified TM
      parameters:
      - name: tmId
        in: query
        description: ID of the TM for the match search
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: TM match segments request
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/TMMatchesRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/TMMatchesRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/TMMatchesRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/TMMatchesRequest'
        required: true
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SegmentWithMatchesModel'
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentWithMatchesModel'
            text/json:
              schema:
                $ref: '#/components/schemas/SegmentWithMatchesModel'
        '400':
          description: 'Returns if:


            - Request model is empty

            - No segment model is specified in the request model

            - Either source or target is not specified

            - The tag type is not "Start", "End" or "Placeholder"'
        '403':
          description: The account cannot access the TM with the specified ID
        '404':
          description: TM with the specified ID was not found
      operationId: postApiIntegrationV1TranslationmemoryMatches
      x-operation-id-source: derived
  /api/integration/v1/translationmemory/{tmId}/targets:
    put:
      tags:
      - TranslationMemories
      summary: Add an array of target languages to a TM
      parameters:
      - name: tmId
        in: path
        description: TM ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Array of the required target languages
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: string
          application/json:
            schema:
              type: array
              items:
                type: string
          text/json:
            schema:
              type: array
              items:
                type: string
          application/*+json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '204':
          description: Request has been successfully completed
        '400':
          description: 'Returns if:


            - Target languages are not specified

            - Target languages contain duplicates

            - Target languages contain the source language

            - Target language cannot be deleted

            - Target languages cannot be updated using the specified parameters'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The account cannot access the TM with the specified ID
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: TM with the specified ID was not found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: putApiIntegrationV1TranslationmemoryByTmIdTargets
      x-operation-id-source: derived
  /api/integration/v1/translationmemory/task/{taskId}:
    delete:
      tags:
      - TranslationMemories
      summary: Removes the specified import task
      parameters:
      - name: taskId
        in: path
        description: ID of a task to be imported to the TM
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The import task has been successfully deleted
        '403':
          description: The account cannot access the TM with the specified ID
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: TM import task with the specified ID was not found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: deleteApiIntegrationV1TranslationmemoryTaskByTaskId
      x-operation-id-source: derived
components:
  schemas:
    TranslationMemoryModel:
      type: object
      properties:
        id:
          type: string
          description: TM ID
          format: uuid
        accountId:
          type: string
          description: Corporate account ID
          format: uuid
        clientId:
          type:
          - string
          - 'null'
          description: Client ID
          format: uuid
        name:
          type:
          - string
          - 'null'
          description: TM name
        description:
          type:
          - string
          - 'null'
          description: Description
        sourceLanguage:
          type:
          - string
          - 'null'
          description: Source language ID
        targetLanguages:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Target languages
        createdDate:
          type: string
          description: TM creation date and time
          format: date-time
        isAutomaticallyCreated:
          type: boolean
          description: Specifies whether the TM was created automatically
        unitCountByLanguageId:
          type:
          - object
          - 'null'
          additionalProperties:
            type: integer
            format: int32
          description: Unit count by language
      additionalProperties: false
      description: TM model
    TMExportMode:
      enum:
      - tmxDefault
      - tmxWithTrados2009PlusCompatibility
      - tmxWithTrados2007Compatibility
      - excel
      type: string
      format: int32
    SegmentWithMatchesModel:
      type: object
      properties:
        sourceText:
          type:
          - string
          - 'null'
          description: Source segment of a found record
        targetText:
          type:
          - string
          - 'null'
          description: Target segment of a found record
        segmentMatch:
          type: integer
          description: Segment match value
          format: int32
        tags:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TagsFromUnit'
          description: Record tags set
        assuranceLevel:
          $ref: '#/components/schemas/IntegrationApiTMTranslationAssuranceLevel'
      additionalProperties: false
      description: Segment with matches send model
    TMImportTaskModel:
      type: object
      properties:
        accountId:
          type: string
          description: Account ID
          format: uuid
        id:
          type: string
          description: Task ID
          format: uuid
        translationMemoryId:
          type: string
          description: TM database ID
          format: uuid
        state:
          type:
          - string
          - 'null'
          description: Task status
        insertedUnitCount:
          type: integer
          description: Inserted unit count
          format: int32
      additionalProperties: false
      description: TM import task model
    CreateTranslationMemoryModel:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Name
        sourceLanguage:
          type:
          - string
          - 'null'
          description: Source language
        targetLanguages:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Target languages
        description:
          type:
          - string
          - 'null'
          description: Description
        clientId:
          type:
          - string
          - 'null'
          description: Client ID
          format: uuid
      additionalProperties: false
      description: TM creation model
    SegmentModel:
      type: object
      properties:
        text:
          type:
          - string
          - 'null'
          description: Segment text
        prevContext:
          type:
          - string
          - 'null'
          description: Previous segment text
        nextContext:
          type:
          - string
          - 'null'
          description: Next segment text
        tags:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SegmentTagModel'
          description: Segment tags
      additionalProperties: false
      description: Segment model
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    TMMatchesRequest:
      type: object
      properties:
        sourceLanguage:
          type:
          - string
          - 'null'
          description: Source language
        targetLanguage:
          type:
          - string
          - 'null'
          description: Target language
        segmentModel:
          $ref: '#/components/schemas/SegmentModel'
        matchThreshold:
          type:
          - integer
          - 'null'
          description: Match threshold
          format: int32
      additionalProperties: false
      description: TM match query model
    TagsFromUnit:
      type: object
      properties:
        position:
          type: integer
          description: Tag insertion position in the target
          format: int32
        order:
          type: integer
          description: Tag order number in the target. Important if two tags have an identical position
          format: int32
      additionalProperties: false
      description: Unit tags data serialization class
    IntegrationApiTMTranslationAssuranceLevel:
      enum:
      - mT
      - questionable
      - regular
      - qualified
      type: string
      description: Minimum TM segment quality
      format: int32
    SegmentTagModel:
      type: object
      properties:
        tagNumber:
          type: integer
          description: Tag number
          format: int32
        tagType:
          type:
          - string
          - 'null'
          description: Tag type
        position:
          type: integer
          description: Tag position
          format: int32
        isVirtual:
          type: boolean
          description: Specifies whether the tag is virtual
        isInvisible:
          type: boolean
          description: Specifies whether the tag is invisible
      additionalProperties: false
      description: Segment tag mandatory information model
