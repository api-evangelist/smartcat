openapi: 3.2.0
info:
  title: Smartcat Directories API
  version: v1
servers:
- url: /
tags:
- name: Directories
paths:
  /api/integration/v2/directory:
    get:
      tags:
      - Directories
      summary: Fetch the specified directory
      parameters:
      - name: type
        in: query
        description: Directory type
        required: true
        schema:
          $ref: '#/components/schemas/DirectoryType'
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DirectoryModel'
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryModel'
            text/json:
              schema:
                $ref: '#/components/schemas/DirectoryModel'
        '400':
          description: Returns if an incorrect directory type is provided
      operationId: getApiIntegrationV2Directory
      x-operation-id-source: derived
  /api/integration/v1/directory/formats:
    get:
      tags:
      - Directories
      summary: Fetch parsing formats supported by the account
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileFormatModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileFormatModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileFormatModel'
        '404':
          description: Unable to find an account connected to the integration API
      operationId: getApiIntegrationV1DirectoryFormats
      x-operation-id-source: derived
components:
  schemas:
    DirectoryType:
      enum:
      - language
      - vendor
      - domain
      - client
      - group
      - projectStatus
      - documentStatus
      - netRate
      - currency
      - freelancerServiceType
      - specialization
      - specializationKnowledgeLevel
      - lspServiceType
      - jobStatus
      - country
      - supplierType
      - workUnitType
      - translationAssuranceLevel
      type: string
      description: Directory type
      format: int32
    FileFormatModel:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: File formats supported by the account
        ocr:
          type: boolean
          description: Specifies whether the OCR format is supported
        mime-type:
          type:
          - string
          - 'null'
          description: Data type (MIME)
        disassembleAlgorithmName:
          type:
          - string
          - 'null'
          description: Disassemble algorithm name
      additionalProperties: false
      description: Model of file formats supported by the account
    DirectoryItemModel:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: ID
        name:
          type:
          - string
          - 'null'
          description: Name
      additionalProperties: false
      description: Directory entry model
    DirectoryModel:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/DirectoryType'
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DirectoryItemModel'
          description: Elements
      additionalProperties: false
      description: Directory model
