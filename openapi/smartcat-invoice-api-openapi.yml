openapi: 3.2.0
info:
  title: Smartcat Invoice API
  version: v1
servers:
- url: /
tags:
- name: Invoice
paths:
  /api/integration/v1/invoice/job:
    post:
      tags:
      - Invoice
      summary: Create payment to freelancer
      requestBody:
        description: Freelancer payment creation parameters
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ImportJobModel'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportJobModel'
          text/json:
            schema:
              $ref: '#/components/schemas/ImportJobModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ImportJobModel'
        required: true
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: One or several query parameters are incorrect
      operationId: postApiIntegrationV1InvoiceJob
      x-operation-id-source: derived
  /api/integration/v2/invoice/job:
    post:
      tags:
      - Invoice
      summary: Create a payment
      requestBody:
        description: Payment creation parameters
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ImportJobModelV2'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportJobModelV2'
          text/json:
            schema:
              $ref: '#/components/schemas/ImportJobModelV2'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ImportJobModelV2'
        required: true
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: One or several query parameters are incorrect
      operationId: postApiIntegrationV2InvoiceJob
      x-operation-id-source: derived
  /api/integration/v1/invoice/jobs:
    post:
      tags:
      - Invoice
      summary: Create an array of freelancer payments
      requestBody:
        description: Freelancer payment creation parameters
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ImportJobModel'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ImportJobModel'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ImportJobModel'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ImportJobModel'
        required: true
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModel'
        '400':
          description: Returns if one or several parameters in a provided job are incorrect
      operationId: postApiIntegrationV1InvoiceJobs
      x-operation-id-source: derived
  /api/integration/v2/invoice/jobs:
    post:
      tags:
      - Invoice
      summary: Create a payments array
      requestBody:
        description: Payment creation parameters
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ImportJobModelV2'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ImportJobModelV2'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ImportJobModelV2'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ImportJobModelV2'
        required: true
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModelV2'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModelV2'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModelV2'
        '400':
          description: Returns if one or several parameters in a provided job are incorrect
      operationId: postApiIntegrationV2InvoiceJobs
      x-operation-id-source: derived
  /api/integration/v1/invoice/job/list:
    get:
      tags:
      - Invoice
      summary: Fetch an array of freelancer payments by ID
      parameters:
      - name: externalIds
        in: query
        description: External payment IDs
        required: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModel'
      operationId: getApiIntegrationV1InvoiceJobList
      x-operation-id-source: derived
  /api/integration/v2/invoice/job/listByExternalId:
    get:
      tags:
      - Invoice
      summary: Fetch an array of payments by ID
      parameters:
      - name: externalIds
        in: query
        description: External payment ID
        required: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModelV2'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModelV2'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModelV2'
      operationId: getApiIntegrationV2InvoiceJobListByExternalId
      x-operation-id-source: derived
  /api/integration/v2/invoice/job/listByCreatedDate:
    get:
      tags:
      - Invoice
      summary: Fetch an array of jobs by creation date
      parameters:
      - name: dateCreatedFrom
        in: query
        description: Fetch the jobs created after the specified date
        required: true
        schema:
          type: string
          format: date-time
      - name: dateCreatedTo
        in: query
        description: Fetch the jobs created before the specified date
        required: true
        schema:
          type: string
          format: date-time
      - name: skip
        in: query
        description: Number of skipped items
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum returned items (not more than 500)
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: Request has been successfully completed
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModelV2'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModelV2'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobModelV2'
      operationId: getApiIntegrationV2InvoiceJobListByCreatedDate
      x-operation-id-source: derived
  /api/integration/v2/invoice/list:
    get:
      tags:
      - Invoice
      summary: Fetch a list of invoices created within the specified period
      parameters:
      - name: dateCreatedFrom
        in: query
        description: Period start (inclusive)
        required: true
        schema:
          type: string
          format: date-time
      - name: dateCreatedTo
        in: query
        description: Period end (inclusive)
        required: true
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Maximum returned items (not more than 10)
        schema:
          type: integer
          format: int32
          default: 10
      - name: skip
        in: query
        description: Number of skipped items
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceModel'
      operationId: getApiIntegrationV2InvoiceList
      x-operation-id-source: derived
  /api/integration/v2/client-agent-invoice/list:
    get:
      tags:
      - Invoice
      summary: Fetch a list of agent invoices
      parameters:
      - name: dateFrom
        in: query
        description: Period start (inclusive)
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        description: Period end (inclusive)
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Limit
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientAgentInvoiceModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientAgentInvoiceModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientAgentInvoiceModel'
      operationId: getApiIntegrationV2ClientAgentInvoiceList
      x-operation-id-source: derived
components:
  schemas:
    SupplierType:
      enum:
      - freelancer
      - company
      type: string
      description: Supplier type
      format: int32
    InvoiceStatus:
      enum:
      - sent
      - paid
      - paymentInProcess
      - cancelled
      type: string
      description: Invoice status
      format: int32
    LegalEntityModel:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Legal entity name
        contactPerson:
          type:
          - string
          - 'null'
          description: Contact person
        vat:
          type:
          - string
          - 'null'
          description: VAT
        legalAddress:
          type:
          - string
          - 'null'
          description: Legal address
        country:
          type:
          - string
          - 'null'
          description: Country
      additionalProperties: false
      description: Legal entity details model
    JobStatus:
      enum:
      - inProgress
      - invitationPending
      - waitingForAssignment
      - waitingForPayment
      - verified
      - paidByCustomer
      - paidToFreelancer
      - markedAsPaid
      - invitationCanceled
      - invitationDeclined
      type: string
      description: Payment status
      format: int32
    ImportJobModel:
      type: object
      properties:
        freelancerId:
          type: string
          description: Linguist ID
          format: uuid
        serviceType:
          type:
          - string
          - 'null'
          description: Service type
        jobDescription:
          type:
          - string
          - 'null'
          description: 'Description: the name of a document or project'
        unitsType:
          type:
          - string
          - 'null'
          description: Job unit type
        unitsAmount:
          type: number
          description: Job unit count
          format: double
        pricePerUnit:
          type: number
          description: Job unit price
          format: double
        currency:
          type:
          - string
          - 'null'
          description: Price and cost currency
        externalNumber:
          type:
          - string
          - 'null'
          description: External payment ID
      additionalProperties: false
      description: Basic class of linguist payment models
    BankRequisitesModel:
      type: object
      properties:
        bankName:
          type:
          - string
          - 'null'
          readOnly: true
        bankAddress:
          type:
          - string
          - 'null'
          readOnly: true
        bic:
          type:
          - string
          - 'null'
          readOnly: true
        swift:
          type:
          - string
          - 'null'
          readOnly: true
        bankCorrAccount:
          type:
          - string
          - 'null'
          readOnly: true
        bankAccount:
          type:
          - string
          - 'null'
          readOnly: true
        currency:
          type:
          - string
          - 'null'
          readOnly: true
      additionalProperties: false
    InvoicePaymentReceiveDestination:
      enum:
      - balance
      - externalBankAccount
      type: string
      format: int32
    JobModel:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Task ID
        status:
          $ref: '#/components/schemas/JobStatus'
        freelancerId:
          type: string
          description: Linguist ID
          format: uuid
        serviceType:
          type:
          - string
          - 'null'
          description: Service type
        jobDescription:
          type:
          - string
          - 'null'
          description: 'Description: the name of a document or project'
        unitsType:
          type:
          - string
          - 'null'
          description: Job unit type
        unitsAmount:
          type: number
          description: Job unit count
          format: double
        pricePerUnit:
          type: number
          description: Job unit price
          format: double
        currency:
          type:
          - string
          - 'null'
          description: Price and cost currency
        externalNumber:
          type:
          - string
          - 'null'
          description: External payment ID
      additionalProperties: false
      description: Linguist payment model
    ImportJobModelV2:
      type: object
      properties:
        supplierEmail:
          type:
          - string
          - 'null'
          description: Vendor email address
        supplierName:
          type:
          - string
          - 'null'
          description: Vendor name
        supplierType:
          $ref: '#/components/schemas/SupplierType'
        serviceType:
          type:
          - string
          - 'null'
          description: Service type
        jobDescription:
          type:
          - string
          - 'null'
          description: 'Description: the name of a document or project'
        unitsType:
          type:
          - string
          - 'null'
          description: Job unit type
        unitsAmount:
          type: number
          description: Job unit count
          format: double
        pricePerUnit:
          type: number
          description: Job unit price
          format: double
        currency:
          type:
          - string
          - 'null'
          description: Price and cost currency
        externalNumber:
          type:
          - string
          - 'null'
          description: External payment ID
        payUntilDate:
          type:
          - string
          - 'null'
          description: Pay until date (not mandatory)
          format: date-time
      additionalProperties: false
      description: Basic class of payment models
    SmartCatLegalEntityModel:
      type: object
      properties:
        registrationNumber:
          type:
          - string
          - 'null'
          description: Registration number
        beneficiary:
          type:
          - string
          - 'null'
          description: Beneficiary
        bankName:
          type:
          - string
          - 'null'
          description: Bank name
        bankAddress:
          type:
          - string
          - 'null'
          description: Bank address
        bankCode:
          type:
          - string
          - 'null'
          description: Bank code
        swift:
          type:
          - string
          - 'null'
          description: SWIFT
        bankAccount:
          type:
          - string
          - 'null'
          description: Bank account number
        achRoutingNumber:
          type:
          - string
          - 'null'
          description: ACH routing number
        wireRoutingNumber:
          type:
          - string
          - 'null'
          description: Wire routing number
        transitNumber:
          type:
          - string
          - 'null'
          description: Transit number
        bankCorrAccount:
          type:
          - string
          - 'null'
          description: Correspondent account
        bankCorrBankEn:
          type:
          - string
          - 'null'
          description: Correspondent bank name (in English)
        bankCorrBankRu:
          type:
          - string
          - 'null'
          description: Correspondent bank name (in Russian)
        iban:
          type:
          - string
          - 'null'
          description: IBAN
        kpp:
          type:
          - string
          - 'null'
          description: KPP
        bic:
          type:
          - string
          - 'null'
          description: BIC
        name:
          type:
          - string
          - 'null'
          description: Legal entity name
        contactPerson:
          type:
          - string
          - 'null'
          description: Contact person
        vat:
          type:
          - string
          - 'null'
          description: VAT
        legalAddress:
          type:
          - string
          - 'null'
          description: Legal address
        country:
          type:
          - string
          - 'null'
          description: Country
      additionalProperties: false
      description: Smartcat legal entity details model
    ClientAgentInvoiceJobModel:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        projectId:
          type:
          - string
          - 'null'
          format: uuid
        description:
          type:
          - string
          - 'null'
        originalCost:
          type: number
          format: double
        convertedCost:
          type: number
          format: double
        originalCurrency:
          type:
          - string
          - 'null'
          readOnly: true
        sourceLanguage:
          type:
          - string
          - 'null'
        targetLanguage:
          type:
          - string
          - 'null'
      additionalProperties: false
    JobModelV2:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Task ID
        invoiceNumber:
          type:
          - string
          - 'null'
          description: Bank account number
        supplierEmail:
          type:
          - string
          - 'null'
          description: Vendor email address
        supplierName:
          type:
          - string
          - 'null'
          description: Vendor name
        supplierType:
          $ref: '#/components/schemas/SupplierType'
        serviceType:
          type:
          - string
          - 'null'
          description: Service type
        jobDescription:
          type:
          - string
          - 'null'
          description: 'Description: the name of a document or project'
        unitsType:
          type:
          - string
          - 'null'
          description: Job unit type
        unitsAmount:
          type: number
          description: Job unit count (zero if the job is paid externally)
          format: double
        pricePerUnit:
          type: number
          description: Job unit price (zero if the job is paid externally)
          format: double
        currency:
          type:
          - string
          - 'null'
          description: Price and cost currency (null if the job is paid externally)
        cost:
          type: number
          description: Total job cost (zero if the job is paid externally)
          format: double
        externalNumber:
          type:
          - string
          - 'null'
          description: External payment ID
        supplierId:
          type:
          - string
          - 'null'
          description: Supplier ID
          format: uuid
        status:
          $ref: '#/components/schemas/JobStatus'
        projectId:
          type:
          - string
          - 'null'
          description: Project ID (optional)
          format: uuid
        sourceLanguage:
          type:
          - string
          - 'null'
          description: Source language code
        targetLanguage:
          type:
          - string
          - 'null'
          description: Target language code
        customFields:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
          description: Custom fields (project tags)
      additionalProperties: false
      description: Payment model
    InvoiceModel:
      type: object
      properties:
        number:
          type:
          - string
          - 'null'
          description: Bank account number
        currency:
          type:
          - string
          - 'null'
          description: Invoice currency
        cost:
          type: number
          description: Invoice total
          format: double
        date:
          type: string
          description: Invoice issue date
          format: date-time
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        payerRequisites:
          $ref: '#/components/schemas/LegalEntityModel'
        payeeRequisites:
          $ref: '#/components/schemas/SmartCatLegalEntityModel'
        jobs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/JobModelV2'
          description: Payments included in the invoice
      additionalProperties: false
      description: Invoice model
    ClientAgentInvoiceModel:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        number:
          type:
          - string
          - 'null'
        externalNumber:
          type:
          - string
          - 'null'
        payerLegalName:
          type:
          - string
          - 'null'
        payerVat:
          type:
          - string
          - 'null'
        payerKpp:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        dateCreated:
          type: string
          format: date-time
        datePaid:
          type:
          - string
          - 'null'
          format: date-time
        dueDate:
          type:
          - string
          - 'null'
          format: date-time
        jobs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ClientAgentInvoiceJobModel'
        currency:
          type:
          - string
          - 'null'
        totalCost:
          type: number
          format: double
        isInternalClient:
          type: boolean
        paymentDestination:
          $ref: '#/components/schemas/InvoicePaymentReceiveDestination'
        bankRequisites:
          $ref: '#/components/schemas/BankRequisitesModel'
      additionalProperties: false
